<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Night Shift</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Space+Mono:wght@700&amp;display=swap">
<style>
body{margin:0}
.dots{background-image:radial-gradient(#E8FF3A 1.6px,transparent 1.8px);background-size:10px 10px}
.stripe{background:repeating-linear-gradient(135deg,#E8FF3A 0 18px,#0B0B0C 18px 36px)}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0B0C; font-family: 'Anton', sans-serif">
<div class="dots" style="position: absolute; right: -60px; top: 120px; width: 300px; height: 300px; border-radius: 50%; opacity: 0.35"></div>
<div class="stripe" style="position: absolute; left: -40px; top: 470px; width: 480px; height: 34px; transform: rotate(-8deg)"></div>
<div style="position: absolute; left: 22px; top: 520px; display: flex; flex-direction: column; line-height: 0.86">
<span style="font-size: 132px; color: {{accent}}">NIGHT</span>
<span style="font-size: 132px; color: transparent; -webkit-text-stroke: 2px #F4F4F0">SHIFT</span>
</div>
<div style="position: absolute; left: 24px; bottom: 40px; right: 24px; display: flex; justify-content: space-between; font-family: 'Space Mono', monospace; font-size: 11px; color: #F4F4F0; letter-spacing: 1px">
<span>SECTOR 09 // 02:47</span>
<span style="color: {{accent}}">● ON AIR</span>
</div>
<div style="position: absolute; left: 24px; top: 300px; width: 64px; height: 64px; border: 3px solid {{accent}}; transform: rotate(45deg)"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E8FF3A"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#E8FF3A' };
}
}
</script>
</body>
</html>
