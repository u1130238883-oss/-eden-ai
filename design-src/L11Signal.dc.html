<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Signal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Space+Mono:wght@700&amp;display=swap">
<style>
body{margin:0}
.dots{background-image:radial-gradient(#0D0F08 2px,transparent 2.3px);background-size:11px 11px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{accent}}; font-family: 'Anton', sans-serif">
<div class="dots" style="position: absolute; left: -120px; top: 520px; width: 420px; height: 420px; border-radius: 50%; opacity: 0.22"></div>
<div style="position: absolute; left: 0; top: 300px; width: 390px; height: 230px; background: #0D0F08"></div>
<div style="position: absolute; left: 22px; top: 300px; font-size: 128px; line-height: 230px; color: {{accent}}; letter-spacing: 0px">SIGNAL</div>
<div style="position: absolute; left: 24px; top: 560px; font-family: 'Space Mono', monospace; font-size: 13px; color: #0D0F08; letter-spacing: 2px">FREQ 09.47 MHz · STRONG</div>
<div style="position: absolute; left: 24px; top: 600px; display: flex; align-items: flex-end; gap: 8px">
<div style="width: 16px; height: 20px; background: #0D0F08"></div>
<div style="width: 16px; height: 36px; background: #0D0F08"></div>
<div style="width: 16px; height: 52px; background: #0D0F08"></div>
<div style="width: 16px; height: 68px; background: #0D0F08"></div>
</div>
<div style="position: absolute; right: 24px; bottom: 44px; font-family: 'Space Mono', monospace; font-size: 11px; color: #0D0F08">CH—11</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C6FF1A"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#C6FF1A' };
}
}
</script>
</body>
</html>
