<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Low Battery</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Space+Mono:wght@700&amp;display=swap">
<style>
body{margin:0}
.bg{background:linear-gradient(170deg,#F4FF4F 0%,#B6FF1F 55%,#5DB800 100%)}
</style>
</helmet>
<div class="bg" style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Anton', sans-serif">
<div style="position: absolute; right: -90px; top: 120px; width: 300px; height: 300px; border-radius: 50%; border: 40px solid rgba(13,15,8,0.08)"></div>
<div style="position: absolute; left: 70px; top: 300px; width: 230px; height: 110px; border: 10px solid #0D0F08; border-radius: 22px; box-sizing: border-box; padding: 10px">
<div style="width: 22%; height: 100%; border-radius: 8px; background: {{accent}}"></div>
</div>
<div style="position: absolute; left: 300px; top: 335px; width: 18px; height: 40px; border-radius: 0 8px 8px 0; background: #0D0F08"></div>
<div style="position: absolute; left: 28px; top: 470px; display: flex; flex-direction: column; line-height: 0.92">
<span style="font-size: 78px; color: #0D0F08">LOW BATTERY</span>
<span style="font-size: 78px; color: transparent; -webkit-text-stroke: 2px #0D0F08">HIGH MOOD</span>
</div>
<div style="position: absolute; left: 28px; bottom: 44px; font-family: 'Space Mono', monospace; font-size: 11px; color: #0D0F08; letter-spacing: 2px">CHARGING... 22% · DO NOT UNPLUG</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF4D2E"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#FF4D2E' };
}
}
</script>
</body>
</html>
