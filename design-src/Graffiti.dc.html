<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Graffiti</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&amp;family=Rubik+Mono+One&amp;display=swap">
<style>
body{margin:0}
.brick{background-color:#5A2E26;background-image:linear-gradient(#3B1D18 3px,transparent 3px),linear-gradient(90deg,#3B1D18 3px,transparent 3px);background-size:60px 30px,60px 60px}
.drip{background:linear-gradient(180deg,#7CFF4F,#7CFF4F 70%,transparent)}
</style>
</helmet>
<div class="brick" style="width: 390px; height: 844px; position: relative; overflow: hidden">
<div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,6,20,0.65), rgba(10,6,20,0.15) 40%, rgba(10,6,20,0.75))"></div>
<div style="position: absolute; left: 10px; top: 330px; width: 370px; text-align: center; font-family: 'Rubik Mono One', sans-serif; font-size: 96px; line-height: 1; color: {{accent}}; -webkit-text-stroke: 4px #12081F; transform: rotate(-8deg); text-shadow: 8px 8px 0 #7CFF4F">MIRO</div>
<div class="drip" style="position: absolute; left: 92px; top: 440px; width: 8px; height: 70px; border-radius: 4px"></div>
<div class="drip" style="position: absolute; left: 210px; top: 430px; width: 6px; height: 110px; border-radius: 3px"></div>
<div class="drip" style="position: absolute; left: 300px; top: 410px; width: 9px; height: 54px; border-radius: 4px"></div>
<div style="position: absolute; left: 36px; top: 590px; font-family: 'Permanent Marker', cursive; font-size: 34px; color: #F4F0E8; transform: rotate(-4deg)">was here '26</div>
<div style="position: absolute; right: 30px; top: 210px; font-family: 'Permanent Marker', cursive; font-size: 26px; color: #FFD43B; transform: rotate(10deg)">★ no rules</div>
<svg aria-hidden="true" style="position: absolute; left: 40px; bottom: 90px" width="120" height="60" viewBox="0 0 120 60"><path d="M6 40 C30 6, 60 56, 84 20 S116 30, 114 12" fill="none" stroke="#F4F0E8" stroke-width="5" stroke-linecap="round"></path></svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF5BC8"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#FF5BC8' };
}
}
</script>
</body>
</html>
