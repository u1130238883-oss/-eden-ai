<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hazard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Space+Mono:wght@700&amp;display=swap">
<style>
body{margin:0}
.haz{background:repeating-linear-gradient(-45deg,#FFC21A 0 28px,#141414 28px 56px)}
.tape{background:#FFC21A}
</style>
</helmet>
<div class="haz" style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Bebas Neue', sans-serif">
<div style="position: absolute; left: 30px; top: 230px; width: 330px; height: 420px; background: #141414; border: 6px solid {{accent}}; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px">
<svg aria-hidden="true" width="120" height="108" viewBox="0 0 120 108"><polygon points="60,6 114,102 6,102" fill="none" stroke="#FFC21A" stroke-width="8" stroke-linejoin="round"></polygon><rect x="55" y="38" width="10" height="36" fill="#FFC21A"></rect><rect x="55" y="82" width="10" height="10" fill="#FFC21A"></rect></svg>
<span style="font-size: 96px; line-height: 0.9; color: #FFC21A">KEEP</span>
<span style="font-size: 96px; line-height: 0.9; color: #F2F2EE">OUT</span>
<span style="font-family: 'Space Mono', monospace; font-size: 12px; color: #FFC21A; letter-spacing: 3px">ZONE 09 · UNSTABLE</span>
</div>
<div class="tape" style="position: absolute; left: -60px; top: 690px; width: 520px; height: 46px; transform: rotate(9deg); display: flex; align-items: center; justify-content: center; font-size: 28px; letter-spacing: 6px; color: #141414; box-shadow: 0 6px 0 rgba(0,0,0,0.35)">CAUTION · CAUTION · CAUTION · CAUTION</div>
<div class="tape" style="position: absolute; left: -60px; top: 160px; width: 520px; height: 46px; transform: rotate(-7deg); display: flex; align-items: center; justify-content: center; font-size: 28px; letter-spacing: 6px; color: #141414; box-shadow: 0 6px 0 rgba(0,0,0,0.35)">DO NOT CROSS · DO NOT CROSS</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFC21A"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#FFC21A' };
}
}
</script>
</body>
</html>
