<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Offline</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&amp;family=Space+Mono:wght@700&amp;display=swap">
<style>
body{margin:0}
.scan{background:repeating-linear-gradient(0deg,rgba(255,255,255,0.04) 0 1px,transparent 1px 4px)}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #08080A; font-family: 'Rubik Mono One', sans-serif">
<div class="scan" style="position: absolute; inset: 0"></div>
<div style="position: absolute; left: 0; top: 420px; width: 390px; height: 120px">
<div style="position: absolute; left: 26px; top: 0; font-size: 62px; color: #FF2E4D; opacity: 0.9">OFF</div>
<div style="position: absolute; left: 20px; top: 0; font-size: 62px; color: #2EE6FF; opacity: 0.9">OFF</div>
<div style="position: absolute; left: 23px; top: 0; font-size: 62px; color: #F5F5F0">OFF</div>
<div style="position: absolute; left: 26px; top: 64px; font-size: 62px; color: #FF2E4D; opacity: 0.9">LINE</div>
<div style="position: absolute; left: 20px; top: 64px; font-size: 62px; color: #2EE6FF; opacity: 0.9">LINE</div>
<div style="position: absolute; left: 23px; top: 64px; font-size: 62px; color: #F5F5F0">LINE</div>
</div>
<div style="position: absolute; left: 0; top: 470px; width: 390px; height: 10px; background: #08080A"></div>
<div style="position: absolute; left: 120px; top: 520px; width: 270px; height: 6px; background: {{accent}}"></div>
<div style="position: absolute; left: 0; top: 380px; width: 160px; height: 3px; background: #2EE6FF"></div>
<div style="position: absolute; left: 24px; top: 600px; font-family: 'Space Mono', monospace; font-size: 12px; line-height: 1.8; color: #8C8C93">&gt; signal lost<br>&gt; reconnecting...<br>&gt; <span style="color: {{accent}}">do not disturb_</span></div>
<div style="position: absolute; right: 24px; bottom: 44px; font-family: 'Space Mono', monospace; font-size: 11px; color: #8C8C93">ERR 0x09</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8FF2E"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#C8FF2E' };
}
}
</script>
</body>
</html>
