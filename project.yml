name: StreetWall
options:
  bundleIdPrefix: com.streetwall
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hant
targets:
  StreetWall:
    type: application
    platform: iOS
    sources:
      - path: StreetWall
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.streetwall.app
        PRODUCT_NAME: StreetWall
        INFOPLIST_FILE: StreetWall/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMPRESS_PNG_FILES: NO
        STRIP_PNG_TEXT: NO
        MARKETING_VERSION: "2.6"
        CURRENT_PROJECT_VERSION: "16"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
