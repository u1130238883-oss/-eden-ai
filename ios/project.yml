name: NineSun
options:
  bundleIdPrefix: com.ninesun
  deploymentTarget:
    iOS: "16.4"
  developmentLanguage: zh-Hant
packages:
  EchoCore:
    path: EchoCore
  # 畫室：Apple 的 Core ML Stable Diffusion，和解開模型 zip 用的 ZIPFoundation
  StableDiffusion:
    url: https://github.com/apple/ml-stable-diffusion
    from: "1.1.0"
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"
targets:
  NineSun:
    type: application
    platform: iOS
    sources:
      - path: NineSun
        excludes:
          - "Resources/**"
      - path: NineSun/Resources
        buildPhase: resources
    dependencies:
      - package: EchoCore
      - package: StableDiffusion
      - package: ZIPFoundation
      # NineSun 的大腦：llama.cpp（CI 照 llama-version.txt 編好放在 Frameworks/）
      - framework: Frameworks/llama.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ninesun.app
        PRODUCT_NAME: NineSun
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Support/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "NineSun"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "把畫室畫好的圖存到你的相簿"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
