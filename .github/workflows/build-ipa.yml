name: Build IPA

on:
  push:
    paths: ["StreetWall/**", "scripts/**", "project.yml", ".github/workflows/build-ipa.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Tooling
        run: brew install xcodegen && xcodebuild -version
      - name: Build & sign shortcuts
        continue-on-error: true
        run: |
          sw_vers
          for pair in "lock:潮流換壁紙" "home:潮流換壁紙主畫面" "both:潮流換壁紙兩者" "auto:潮流自動換壁紙"; do
            kind="${pair%%:*}"; name="${pair#*:}"; dst="StreetWall/Resources/$name.shortcut"
            python3 scripts/make_shortcut.py "$kind" "/tmp/$kind.shortcut"
            shortcuts sign --mode anyone --input "/tmp/$kind.shortcut" --output "$dst" 2>&1 | grep -v "Unrecognized attribute" || true
            [ -f "$dst" ] || scripts/hubsign.sh "/tmp/$kind.shortcut" "$name" "$dst" || echo "SIGN FAILED $name"
          done
          ls -la StreetWall/Resources/ | grep -i shortcut || echo "NO SIGNED FILE"
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project StreetWall.xcodeproj -target StreetWall \
            -configuration Release -sdk iphoneos SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:" build.log; tail -60 build.log; exit 1; }
      - name: Package IPA
        run: |
          mkdir -p out/Payload
          cp -R build/Release-iphoneos/StreetWall.app out/Payload/
          cd out && zip -qry StreetWall.ipa Payload && ls -la StreetWall.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: StreetWall-ipa
          path: out/StreetWall.ipa
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}-${{ github.run_attempt }}"
          for i in 1 2 3 4 5; do
            gh release view "$TAG" >/dev/null 2>&1 && gh release upload "$TAG" out/StreetWall.ipa --clobber && exit 0
            gh release create "$TAG" out/StreetWall.ipa \
              --target "${{ github.sha }}" \
              --title "潮流壁紙 IPA #${{ github.run_number }}" \
              --notes "未簽名 IPA（iOS 17+）。用 Sideloadly / AltStore 以你的 Apple ID 簽名後安裝。" && exit 0
            sleep $((i * 5))
          done
          exit 1
