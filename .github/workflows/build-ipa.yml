name: Build Endocrine Atlas IPA

on:
  push:
    branches: [endocrine-atlas-ios]
    paths:
      - "endocrine-atlas-ios/**"
      - ".github/workflows/build-ipa.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: endocrine-atlas-ios
        run: xcodegen generate

      - name: Build app (unsigned)
        working-directory: endocrine-atlas-ios
        run: |
          set -o pipefail
          xcodebuild \
            -project EndocrineAtlas.xcodeproj \
            -scheme EndocrineAtlas \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 80

      - name: Package IPA
        working-directory: endocrine-atlas-ios
        run: |
          APP=build/Build/Products/Release-iphoneos/EndocrineAtlas.app
          test -d "$APP"
          ls -la "$APP" "$APP/Web"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry EndocrineAtlas.ipa Payload
          ls -la EndocrineAtlas.ipa

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: EndocrineAtlas-ipa
          path: endocrine-atlas-ios/EndocrineAtlas.ipa

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: medical-handbook-v6-build${{ github.run_number }}
          name: 掌上醫學百科 v6（build ${{ github.run_number }}）
          target_commitish: ${{ github.sha }}
          make_latest: false
          files: endocrine-atlas-ios/EndocrineAtlas.ipa
          body: |
            未簽名的 iOS 安裝檔（.ipa）。請用 Sideloadly、AltStore 或 TrollStore 以你自己的 Apple ID 簽名後安裝。
            詳細步驟見 endocrine-atlas-ios/README.md。
