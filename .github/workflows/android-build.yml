name: Build APK

# 目前不需要 APK，推送時不自動跑；要編時到 Actions 頁手動按 Run workflow。
on:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 測試並打包 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # secrets 不能直接寫在 step 的 if 裡，先在這裡轉成普通環境變數
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: 設定 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 設定 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: 確認九型人格的產生檔與資料同步
        run: |
          python3 tools/gen_enneagram.py
          if ! git diff --quiet -- ios/NineTwelve/Engine/Enneagram.swift \
                                   android/app/src/main/java/com/ninetwelve/fortune/engine/Enneagram.kt; then
            echo "::error::Enneagram 產生檔與 tools/enneagram_data.py 不同步，請執行 python3 tools/gen_enneagram.py 後提交"
            git diff --stat
            exit 1
          fi

      - name: 驗算法（與 PDF 原文對照）
        run: python3 tools/verify_algorithm.py

      - name: 確認圖檔都在
        run: |
          for f in \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
            android/app/src/direct/res/drawable-nodpi/pay_wechat.png \
            android/app/src/direct/res/drawable-nodpi/pay_alipay.png ; do
            test -s "$f" || { echo "::error::缺少 $f，請執行 python3 tools/make_android_assets.py"; exit 1; }
          done

      # 一次編四個變體，用 --continue 把所有錯誤一次收齊；
      # Gradle 的堆疊追蹤很長，失敗時只把 Kotlin 的 e:/error 行印在最後面，方便看。
      - name: 編譯四個變體
        working-directory: android
        run: |
          set +e
          gradle --no-daemon --continue --console=plain \
            compileCjkPlayDebugKotlin \
            compileCjkDirectDebugKotlin \
            compileCjkFreeDebugKotlin \
            compileLatinPlayDebugKotlin \
            compileLatinDirectDebugKotlin \
            compileLatinFreeDebugKotlin \
            > /tmp/compile.log 2>&1
          CODE=$?
          if [ $CODE -ne 0 ]; then
            # 完整記錄先摺疊起來，錯誤摘要放最後，這樣從尾巴看就是重點
            echo "::group::完整 Gradle 記錄"
            tail -300 /tmp/compile.log
            echo "::endgroup::"
            echo "===== 編譯錯誤摘要（共 $(grep -c "^e: " /tmp/compile.log) 條）====="
            grep -E "^e: " /tmp/compile.log | sed 's#^e: file://[^ ]*/android/app/src/#e: #' | head -60
          fi
          exit $CODE

      - name: 單元測試（與 iOS 版同一組案例）
        working-directory: android
        run: gradle testCjkPlayDebugUnitTest --no-daemon

      # 六個版本：
      #   cjkPlay      中英版，Google Play 帳單（上架 Play 用）
      #   latinPlay    西義版，Google Play 帳單（上架 Play 用）
      #   cjkDirect    中英版，微信／支付寶 + 啟用碼（自行發佈用）
      #   latinDirect  西義版，微信／支付寶 + 啟用碼（自行發佈用）
      #   cjkFree      中英版，完全解鎖、無付費機制（自己試用與展示用）
      #   latinFree    西義版，完全解鎖、無付費機制（自己試用與展示用）
      - name: 建置六個 APK
        working-directory: android
        run: |
          gradle \
            assembleCjkPlayDebug \
            assembleLatinPlayDebug \
            assembleCjkDirectDebug \
            assembleLatinDirectDebug \
            assembleCjkFreeDebug \
            assembleLatinFreeDebug \
            --no-daemon

      - name: 整理成好認的檔名並檢查套件名
        working-directory: android
        run: |
          mkdir -p dist
          declare -A NAMES=(
            [cjk-play]=NineTwelve-zh-en-play.apk
            [latin-play]=NueveYDoce-es-it-play.apk
            [cjk-direct]=NineTwelve-zh-en-direct.apk
            [latin-direct]=NueveYDoce-es-it-direct.apk
            [cjk-free]=NineTwelve-zh-en-FREE.apk
            [latin-free]=NueveYDoce-es-it-FREE.apk
          )
          for key in "${!NAMES[@]}"; do
            src=$(find app/build/outputs/apk -name "app-${key}-debug.apk" | head -1)
            test -n "$src" || { echo "::error::找不到 app-${key}-debug.apk"; exit 1; }
            cp "$src" "dist/${NAMES[$key]}"
          done

          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          : > /tmp/ids
          for f in dist/*.apk; do
            ID=$("$AAPT" dump packagename "$f")
            echo "$f -> $ID"
            echo "$ID" >> /tmp/ids
          done
          # 六個版本必須是六個不同的套件名，否則會互相覆蓋安裝
          test "$(sort -u /tmp/ids | wc -l)" -eq 6 \
            || { echo "::error::套件名有重複"; sort /tmp/ids; exit 1; }
          ls -lh dist

      # 主畫面上的名稱是啟動器依 App 語言挑 values-xx/strings.xml 得來的。
      # 每個版本都要帶到自己那兩個語言，還要有 localeConfig，切語言才會跟著換。
      - name: 確認每個語言都有自己的主畫面名稱
        working-directory: android
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          fail=0
          for pair in \
            "NineTwelve-zh-en:Nine & Twelve:Nine & Twelve" \
            "NueveYDoce-es-it:Nine & Twelve:Nine & Twelve" ; do
            prefix="${pair%%:*}"; rest="${pair#*:}"
            first="${rest%%:*}"; second="${rest#*:}"
            for f in dist/${prefix}*.apk; do
              dump=$("$AAPT" dump strings "$f")
              for want in "$first" "$second"; do
                if printf '%s\n' "$dump" | grep -qF "$want"; then
                  echo "$f 有「$want」"
                else
                  echo "::error::$f 少了「$want」這個名稱"; fail=1
                fi
              done
              "$AAPT" dump xmltree "$f" --file AndroidManifest.xml \
                | grep -q "localeConfig" \
                || { echo "::error::$f 沒有 localeConfig，切語言時名稱不會換"; fail=1; }
            done
          done
          test "$fail" -eq 0

      - name: 上傳 APK — 中英版（Google Play）
        uses: actions/upload-artifact@v4
        with:
          name: NineTwelve-zh-en-play-apk
          path: android/dist/NineTwelve-zh-en-play.apk
          if-no-files-found: error
          retention-days: 90

      - name: 上傳 APK — 西義版（Google Play）
        uses: actions/upload-artifact@v4
        with:
          name: NueveYDoce-es-it-play-apk
          path: android/dist/NueveYDoce-es-it-play.apk
          if-no-files-found: error
          retention-days: 90

      - name: 上傳 APK — 中英版（微信／支付寶直連）
        uses: actions/upload-artifact@v4
        with:
          name: NineTwelve-zh-en-direct-apk
          path: android/dist/NineTwelve-zh-en-direct.apk
          if-no-files-found: error
          retention-days: 90

      - name: 上傳 APK — 西義版（微信／支付寶直連）
        uses: actions/upload-artifact@v4
        with:
          name: NueveYDoce-es-it-direct-apk
          path: android/dist/NueveYDoce-es-it-direct.apk
          if-no-files-found: error
          retention-days: 90

      - name: 上傳 APK — 解鎖版（中英，無付費機制）
        uses: actions/upload-artifact@v4
        with:
          name: NineTwelve-zh-en-FREE-apk
          path: android/dist/NineTwelve-zh-en-FREE.apk
          if-no-files-found: error
          retention-days: 90

      - name: 上傳 APK — 解鎖版（西義，無付費機制）
        uses: actions/upload-artifact@v4
        with:
          name: NueveYDoce-es-it-FREE-apk
          path: android/dist/NueveYDoce-es-it-FREE.apk
          if-no-files-found: error
          retention-days: 90

      # 要上傳 Google Play 的 AAB 必須用你自己的金鑰簽章（Play 會拒絕 debug 金鑰）。
      # 在 repo 的 Settings → Secrets and variables → Actions 設好這四個 secret 後才會執行。
      - name: 建置 Google Play 上傳用的 AAB
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$PWD/upload.jks"
          cat > keystore.properties <<EOF
          storeFile=$PWD/upload.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          gradle bundleCjkPlayRelease bundleLatinPlayRelease --no-daemon --stacktrace
          mkdir -p dist
          find app/build/outputs/bundle -name '*.aab' -exec cp {} dist/ \;
          rm -f keystore.properties upload.jks

      - name: 上傳 AAB
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: play-store-aab
          path: android/dist/*.aab
          if-no-files-found: error
          retention-days: 90
