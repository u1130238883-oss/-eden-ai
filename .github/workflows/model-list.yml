name: List model files

# 列出 Hugging Face 上幾個模型倉庫裡的 GGUF 檔名和大小（選大腦模型用；這台機器連得到 Hugging Face）
on:
  push:
    paths:
      - ".github/workflows/model-list.yml"
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List
        run: |
          for r in mradermacher/Huihui-gemma-4-E2B-it-abliterated-GGUF mradermacher/gemma-4-E2B-it-SDFT_Heretic_RP-GGUF \
                   bartowski/Dolphin3.0-Llama3.2-3B-GGUF mradermacher/Dolphin3.0-Llama3.2-3B-GGUF \
                   mradermacher/Huihui-Phi-4-mini-instruct-abliterated-GGUF mradermacher/Phi-4-mini-instruct-abliterated-GGUF \
                   mradermacher/Huihui-Ministral-3-3B-Instruct-2512-abliterated-GGUF mradermacher/Ministral-3-3B-Instruct-2512-abliterated-GGUF \
                   mradermacher/Josiefied-Qwen3-4B-abliterated-v2-GGUF bartowski/Goekdeniz-Guelmez_Josiefied-Qwen3-4B-abliterated-v2-GGUF \
                   mradermacher/Huihui-SmolLM3-3B-abliterated-GGUF mradermacher/Huihui-Llama-3.2-3B-Instruct-abliterated-GGUF \
                   mradermacher/Huihui-Qwen3-4B-Instruct-2507-abliterated-GGUF; do
            echo "== $r"
            curl -s "https://huggingface.co/api/models/$r/tree/main" | python3 -c '
          import json, sys
          try:
              d = json.load(sys.stdin)
              if isinstance(d, dict): print("   ", d.get("error"))
              else:
                  for f in d:
                      p = f.get("path", "")
                      if p.endswith(".gguf") or p.endswith(".safetensors") or p == "README.md": print("   ", p, f.get("size"))
          except Exception as e: print("   (no listing)", e)'
          done
