name: List model files

# 在 Hugging Face 上找模型、列出 GGUF 檔名和大小（選大腦模型用；這台機器連得到 Hugging Face）
on:
  push:
    paths:
      - ".github/workflows/model-list.yml"
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Search
        run: |
          for q in "gemma-4-E4B" "gemma-4-E4B heretic" "gemma-4-E4B uncensored" "gemma-4-E4B rp" "gemma-4-E4B nsfw" "gemma-4-E4B abliterated" \
                   "gemma-4 heretic" "gemma-3-4b rp" "Stheno 8B" "Lumimaid 8B" "Lunaris 8B" "8B uncensored roleplay" "Gemma 4 E4B Chinese"; do
            echo "### search: $q"
            curl -s "https://huggingface.co/api/models?search=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$q")&filter=gguf&sort=downloads&limit=25" | python3 -c '
          import json, sys
          try:
              for m in json.load(sys.stdin): print("   ", m.get("id"), m.get("downloads"), m.get("likes"))
          except Exception as e: print("   (none)", e)'
          done
      - name: List
        run: |
          for r in mradermacher/Huihui-gemma-4-E4B-it-abliterated-GGUF mradermacher/gemma-4-E4B-it-OBLITERATED-GGUF \
                   mradermacher/gemma-4-E4B-it-SDFT_Heretic_RP-GGUF mradermacher/gemma-4-E4B-it-heretic-GGUF \
                   bartowski/L3-8B-Stheno-v3.2-GGUF mradermacher/L3-8B-Stheno-v3.2-GGUF bartowski/Lumimaid-v0.2-8B-GGUF \
                   bartowski/L3-8B-Lunaris-v1-GGUF mradermacher/L3-8B-Lunaris-v1-GGUF; do
            echo "== $r"
            curl -s "https://huggingface.co/api/models/$r/tree/main" | python3 -c '
          import json, sys
          try:
              d = json.load(sys.stdin)
              if isinstance(d, dict): print("   ", d.get("error"))
              else:
                  for f in d:
                      p = f.get("path", "")
                      if ("Q4_K_M" in p or "q4_k_m" in p or "Q4_K_S" in p) and p.endswith(".gguf"): print("   ", p, f.get("size"))
          except Exception as e: print("   (no listing)", e)'
          done
