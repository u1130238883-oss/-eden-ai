name: List model files

# 在 Hugging Face 上找模型、列出 GGUF 檔名和大小（選大腦模型用；這台機器連得到 Hugging Face）
on:
  push:
    paths:
      - ".github/workflows/model-list.yml"
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Core ML image models
        run: |
          for q in "coreml 6bit" "coreml-6bit" "CoreML 6bit anime" "coreml palettized anime" "split-einsum 6bit" "coreml ios stable diffusion"; do
            echo "### search: $q"
            curl -s "https://huggingface.co/api/models?search=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$q")&sort=downloads&limit=20" | python3 -c '
          import json, sys
          for m in json.load(sys.stdin): print("   ", m.get("id"), m.get("downloads"), m.get("likes"))'
          done
          for r in darkmaniac7/TokForge-RealisticVision-5.1-CoreML-6bit mahmudplx/coreml-realisticvision-5.1-6bit veran666/zoria-realistic-vision-5.1-6bit-coreml \
                   LocalMuseAI/coreml-cyberillustrious-semi-realistic-play-v4-6bit coreml-community/coreml-OrangeMixs coreml-community/coreml-Counterfeit \
                   coreml-community/coreml-ReV-Animated coreml-community/coreml-realisticVision-v51VAE_cn machine98/Dreamshaper_coreml_sdxl_nsfw; do
            echo "== $r"
            curl -s "https://huggingface.co/api/models/$r/tree/main?recursive=1" | python3 -c '
          import json, sys
          try:
              d = json.load(sys.stdin)
              if isinstance(d, dict): print("   ", d.get("error"))
              else:
                  for f in d:
                      p = f.get("path","")
                      if f.get("type") == "file" and (p.endswith(".zip") or "Unet" in p and p.endswith("weight.bin") or p.endswith("README.md")): print("   ", p, f.get("size"))
          except Exception as e: print("   (no listing)", e)' | head -30
          done
