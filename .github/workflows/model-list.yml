name: List model files

# 在 Hugging Face 上找模型、列出 GGUF 檔名和大小（選大腦模型用；這台機器連得到 Hugging Face）
on:
  push:
    paths:
      - ".github/workflows/model-list.yml"
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List
        run: |
          for r in HauhauCS/Qwen3.5-9B-Uncensored-HauhauCS-Aggressive DavidAU/Qwen3.5-9B-The-Defiant-Fable-Uncensored-Heretic-NEO-IMATRIX-MAX-MTP-GGUF \
                   mradermacher/Ornith-1.5-9B-uncensored-GGUF llmfan46/Qwen3.5-9B-Ultra-Uncensored-Heretic-GGUF \
                   mlabonne/Hermes-3-Llama-3.1-8B-lorablated-GGUF bartowski/Hermes-3-Llama-3.1-8B-lorablated-GGUF \
                   mradermacher/mistralai_Ministral-3-8B-Instruct-2512-abliterated-GGUF DevQuasar-12/huihui-ai.GLM-4-9B-0414-abliterated-GGUF \
                   bartowski/L3-8B-Stheno-v3.2-GGUF; do
            echo "== $r"
            curl -s "https://huggingface.co/api/models/$r/tree/main" | python3 -c '
          import json, sys
          try:
              d = json.load(sys.stdin)
              if isinstance(d, dict): print("   ", d.get("error"))
              else:
                  for f in d:
                      p = f.get("path", "")
                      if p.endswith(".gguf") and ("Q4" in p.upper() or "Q5" in p.upper()): print("   ", p, f.get("size"))
          except Exception as e: print("   (no listing)", e)'
          done
