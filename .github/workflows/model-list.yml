name: List model files

# 在 Hugging Face 上找模型、列出 GGUF 檔名和大小（選大腦模型用；這台機器連得到 Hugging Face）
on:
  push:
    paths:
      - ".github/workflows/model-list.yml"
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List
        run: |
          for r in HauhauCS/Gemma-4-E4B-Uncensored-HauhauCS-Aggressive llmfan46/gemma-4-E4B-it-ultra-uncensored-heretic-GGUF \
                   mradermacher/gemma-4-E4B-it-ultra-uncensored-heretic-GGUF mradermacher/gemma4-e4b-mahou-nsfw-GGUF \
                   bartowski/rpDungeon_Gemma-4-E4B-Luchador-GGUF TrevorJS/gemma-4-E4B-it-uncensored-GGUF \
                   mradermacher/gemma-4-E4B-it-uncensored-GGUF mradermacher/gemma4-E4B-it-Abliterated-AND-Disinhibited-USE-THIS-GGUF; do
            echo "== $r"
            curl -s "https://huggingface.co/api/models/$r/tree/main" | python3 -c '
          import json, sys
          try:
              d = json.load(sys.stdin)
              if isinstance(d, dict): print("   ", d.get("error"))
              else:
                  for f in d:
                      p = f.get("path", "")
                      if p.endswith(".gguf") and ("Q4" in p.upper() or "Q5" in p.upper()): print("   ", p, f.get("size"))
          except Exception as e: print("   (no listing)", e)'
          done
