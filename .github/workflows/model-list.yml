name: List model files

# 在 Hugging Face 上找模型、列出 GGUF 檔名和大小（選大腦模型用；這台機器連得到 Hugging Face）
on:
  push:
    paths:
      - ".github/workflows/model-list.yml"
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Core ML image models
        run: |
          echo "### coreml-community by downloads"
          curl -s "https://huggingface.co/api/models?author=coreml-community&sort=downloads&limit=60" | python3 -c '
          import json, sys
          for m in json.load(sys.stdin): print("   ", m.get("id"), m.get("downloads"), m.get("likes"))'
          for q in "coreml stable diffusion" "coreml realistic" "coreml anime" "coreml sdxl" "coreml nsfw" "coreml-stable-diffusion palettized"; do
            echo "### search: $q"
            curl -s "https://huggingface.co/api/models?search=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$q")&sort=downloads&limit=15" | python3 -c '
          import json, sys
          for m in json.load(sys.stdin): print("   ", m.get("id"), m.get("downloads"), m.get("likes"))'
          done
          for r in apple/coreml-stable-diffusion-v1-5-palettized apple/coreml-stable-diffusion-2-1-base-palettized apple/coreml-stable-diffusion-xl-base-ios \
                   coreml-community/coreml-realisticVision-v51-VAE coreml-community/coreml-AbyssOrangeMix3 coreml-community/coreml-anything-v4.0 \
                   coreml-community/coreml-realisticVision-v20 coreml-community/coreml-deliberate-v2; do
            echo "== $r"
            curl -s "https://huggingface.co/api/models/$r/tree/main?recursive=1" | python3 -c '
          import json, sys
          try:
              d = json.load(sys.stdin)
              if isinstance(d, dict): print("   ", d.get("error"))
              else:
                  for f in d:
                      if f.get("type") == "file": print("   ", f.get("path"), f.get("size"))
          except Exception as e: print("   (no listing)", e)' | head -40
          done
