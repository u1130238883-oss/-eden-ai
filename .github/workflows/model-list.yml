name: List model files

# 列出 Hugging Face 上幾個模型倉庫裡的 GGUF 檔名和大小（選大腦模型用；這台機器連得到 Hugging Face）
on:
  push:
    paths:
      - ".github/workflows/model-list.yml"
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List
        run: |
          for r in Abiray/gemma-4-E4B-it-OBLITERATED-GGUF mradermacher/gemma-4-E4B-it-OBLITERATED-GGUF \
                   mradermacher/gemma-4-E4B-it-SDFT_Heretic_RP-GGUF mradermacher/Huihui-gemma-4-E4B-it-abliterated-GGUF \
                   huihui-ai/Huihui-gemma-4-E4B-it-abliterated mradermacher/Huihui-Qwen3.5-2B-abliterated-GGUF \
                   mradermacher/gemma-4-E2B-it-OBLITERATED-GGUF mradermacher/Llama-3.2-3B-Instruct-uncensored-GGUF \
                   mradermacher/Huihui-gemma-3-4b-it-abliterated-GGUF mlabonne/gemma-3-4b-it-abliterated-GGUF; do
            echo "== $r"
            curl -s "https://huggingface.co/api/models/$r/tree/main" | python3 -c '
          import json, sys
          try:
              d = json.load(sys.stdin)
              if isinstance(d, dict): print("   ", d.get("error"))
              else:
                  for f in d:
                      p = f.get("path", "")
                      if p.endswith(".gguf") or p.endswith(".safetensors") or p == "README.md": print("   ", p, f.get("size"))
          except Exception as e: print("   (no listing)", e)'
          done
