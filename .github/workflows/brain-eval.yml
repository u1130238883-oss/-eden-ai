name: Brain eval

# NineSun 的大腦（手機上的大型語言模型）：在 Mac 上真的下載模型、讀進來、用 NineSun 的提示問一批問題，
# 印出回答和速度，用來選模型、調提示。commit 訊息有 [brain] 或手動執行。
on:
  push:
    paths:
      - ".github/workflows/brain-eval.yml"
      - "ios/BrainEval/**"
      - "ios/NineSun/Brain/**"
  workflow_dispatch:

jobs:
  eval:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[brain]')
    runs-on: macos-15
    timeout-minutes: 75
    # 每個模型一台機器同時跑
    strategy:
      fail-fast: false
      matrix:
        model:
          - name: gemma4-e4b-rp
            url: https://huggingface.co/mradermacher/gemma-4-E4B-it-SDFT_Heretic_RP-GGUF/resolve/main/gemma-4-E4B-it-SDFT_Heretic_RP.Q4_K_M.gguf
          - name: gemma4-e4b-aggressive
            url: https://huggingface.co/HauhauCS/Gemma-4-E4B-Uncensored-HauhauCS-Aggressive/resolve/main/Gemma-4-E4B-Uncensored-HauhauCS-Aggressive-Q4_K_M.gguf
          - name: gemma4-e4b-ultra
            url: https://huggingface.co/llmfan46/gemma-4-E4B-it-ultra-uncensored-heretic-GGUF/resolve/main/gemma-4-E4B-it-ultra-uncensored-heretic-Q4_K_M.gguf
          - name: gemma4-e4b-mahou
            url: https://huggingface.co/mradermacher/gemma4-e4b-mahou-nsfw-GGUF/resolve/main/gemma4-e4b-mahou-nsfw.Q4_K_M.gguf
          - name: gemma4-e4b-disinhibited
            url: https://huggingface.co/mradermacher/gemma4-E4B-it-Abliterated-AND-Disinhibited-USE-THIS-GGUF/resolve/main/gemma4-E4B-it-Abliterated-AND-Disinhibited-USE-THIS.Q4_K_M.gguf
          - name: gemma4-e4b-luchador
            url: https://huggingface.co/bartowski/rpDungeon_Gemma-4-E4B-Luchador-GGUF/resolve/main/rpDungeon_Gemma-4-E4B-Luchador-Q4_K_M.gguf
    steps:
      - uses: actions/checkout@v4

      - name: Use Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$X"

      - name: Build llama.cpp (macOS framework)
        run: |
          LLAMA_TAG=$(cat ios/llama-version.txt)
          git clone --depth 1 --branch "$LLAMA_TAG" https://github.com/ggml-org/llama.cpp "$RUNNER_TEMP/llama.cpp"
          cd "$RUNNER_TEMP/llama.cpp" && ./build-xcframework.sh macos 2>&1 | tail -5

      - name: Compile eval
        run: |
          F=$(dirname "$(find "$RUNNER_TEMP/llama.cpp/build-apple/llama.xcframework" -maxdepth 2 -name llama.framework -path '*macos*' | head -1)")
          swiftc -O -F "$F" -framework llama -Xlinker -rpath -Xlinker "$F" \
            ios/NineSun/Brain/LlamaRunner.swift ios/NineSun/Brain/LocalBrain.swift ios/BrainEval/main.swift -o brain-eval

      - name: Download model
        run: |
          curl -fsSL --retry 3 -o model.gguf "${{ matrix.model.url }}"
          ls -la model.gguf

      # 先試 GPU（Metal）；這台機器不支援就改用 CPU。回答一題印一題（逐行輸出，不會等到最後）
      - name: Eval
        env:
          NSUnbufferedIO: "YES"
        run: |
          if ! timeout 900 ./brain-eval model.gguf ios/BrainEval/quick.txt gpu; then
            echo "######## GPU 不行，改用 CPU"
            ./brain-eval model.gguf ios/BrainEval/quick.txt
          fi
