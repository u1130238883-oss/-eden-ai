name: Brain eval

# NineSun 的大腦（手機上的大型語言模型）：在 Mac 上真的下載模型、讀進來、用 NineSun 的提示問一批問題，
# 印出回答和速度，用來選模型、調提示。commit 訊息有 [brain] 或手動執行。
on:
  push:
    paths:
      - ".github/workflows/brain-eval.yml"
      - "ios/BrainEval/**"
      - "ios/NineSun/Brain/**"
  workflow_dispatch:

jobs:
  eval:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[brain]')
    runs-on: macos-15
    timeout-minutes: 75
    # 每個模型一台機器同時跑
    strategy:
      fail-fast: false
      matrix:
        model:
          - name: qwen35-4b-open
            url: https://huggingface.co/mradermacher/Huihui-Qwen3.5-4B-abliterated-GGUF/resolve/main/Huihui-Qwen3.5-4B-abliterated.Q4_K_M.gguf
          - name: gemma4-e2b-open
            url: https://huggingface.co/mradermacher/Huihui-gemma-4-E2B-it-abliterated-GGUF/resolve/main/Huihui-gemma-4-E2B-it-abliterated.Q4_K_M.gguf
          - name: gemma3-4b-open
            url: https://huggingface.co/mlabonne/gemma-3-4b-it-abliterated-GGUF/resolve/main/gemma-3-4b-it-abliterated.q4_k_m.gguf
          - name: dolphin3-3b
            url: https://huggingface.co/bartowski/Dolphin3.0-Llama3.2-3B-GGUF/resolve/main/Dolphin3.0-Llama3.2-3B-Q4_K_M.gguf
          - name: llama32-3b-uncensored
            url: https://huggingface.co/mradermacher/Llama-3.2-3B-Instruct-uncensored-GGUF/resolve/main/Llama-3.2-3B-Instruct-uncensored.Q4_K_M.gguf
          - name: phi4-mini-open
            url: https://huggingface.co/mradermacher/Phi-4-mini-instruct-abliterated-GGUF/resolve/main/Phi-4-mini-instruct-abliterated.Q4_K_M.gguf
          - name: smollm3-3b-open
            url: https://huggingface.co/mradermacher/Huihui-SmolLM3-3B-abliterated-GGUF/resolve/main/Huihui-SmolLM3-3B-abliterated.Q4_K_M.gguf
          - name: qwen35-2b-open
            url: https://huggingface.co/mradermacher/Huihui-Qwen3.5-2B-abliterated-GGUF/resolve/main/Huihui-Qwen3.5-2B-abliterated.Q4_K_M.gguf
    steps:
      - uses: actions/checkout@v4

      - name: Use Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$X"

      - name: Build llama.cpp (macOS framework)
        run: |
          LLAMA_TAG=$(cat ios/llama-version.txt)
          git clone --depth 1 --branch "$LLAMA_TAG" https://github.com/ggml-org/llama.cpp "$RUNNER_TEMP/llama.cpp"
          cd "$RUNNER_TEMP/llama.cpp" && ./build-xcframework.sh macos 2>&1 | tail -5

      - name: Compile eval
        run: |
          F=$(dirname "$(find "$RUNNER_TEMP/llama.cpp/build-apple/llama.xcframework" -maxdepth 2 -name llama.framework -path '*macos*' | head -1)")
          swiftc -O -F "$F" -framework llama -Xlinker -rpath -Xlinker "$F" \
            ios/NineSun/Brain/LlamaRunner.swift ios/NineSun/Brain/LocalBrain.swift ios/BrainEval/main.swift -o brain-eval

      - name: Download model
        run: |
          curl -fsSL --retry 3 -o model.gguf "${{ matrix.model.url }}"
          ls -la model.gguf

      # 先試 GPU（Metal）；這台機器不支援就改用 CPU。回答一題印一題（逐行輸出，不會等到最後）
      - name: Eval
        env:
          NSUnbufferedIO: "YES"
        run: |
          if ! timeout 900 ./brain-eval model.gguf ios/BrainEval/questions.txt gpu; then
            echo "######## GPU 不行，改用 CPU"
            ./brain-eval model.gguf ios/BrainEval/questions.txt
          fi
