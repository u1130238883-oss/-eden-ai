name: Brain eval

# NineSun 的大腦（手機上的大型語言模型）：在 Mac 上真的下載模型、讀進來、用 NineSun 的提示問一批問題，
# 印出回答和速度，用來選模型、調提示。commit 訊息有 [brain] 或手動執行。
on:
  push:
    paths:
      - ".github/workflows/brain-eval.yml"
  workflow_dispatch:

jobs:
  eval:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[brain]')
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Use Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$X"

      - name: Build llama.cpp (macOS framework)
        run: |
          LLAMA_TAG=$(cat ios/llama-version.txt)
          git clone --depth 1 --branch "$LLAMA_TAG" https://github.com/ggml-org/llama.cpp "$RUNNER_TEMP/llama.cpp"
          cd "$RUNNER_TEMP/llama.cpp" && ./build-xcframework.sh macos 2>&1 | tail -20
          ls build-apple/llama.xcframework

      - name: Compile eval
        run: |
          F=$(dirname "$(find "$RUNNER_TEMP/llama.cpp/build-apple/llama.xcframework" -maxdepth 2 -name llama.framework -path '*macos*' | head -1)")
          echo "framework dir: $F"; ls "$F"
          swiftc -O -F "$F" -framework llama -Xlinker -rpath -Xlinker "$F" \
            ios/NineSun/Brain/LlamaRunner.swift ios/NineSun/Brain/LocalBrain.swift ios/BrainEval/main.swift -o brain-eval

      - name: List candidate models
        run: |
          for r in unsloth/Qwen3.5-4B-GGUF bartowski/Qwen_Qwen3.5-4B-GGUF Qwen/Qwen3.5-4B-GGUF unsloth/Qwen3.5-2B-GGUF unsloth/Qwen3-4B-Instruct-2507-GGUF; do
            echo "== $r"
            curl -s "https://huggingface.co/api/models/$r/tree/main" | python3 -c '
          import json, sys
          try:
              for f in json.load(sys.stdin):
                  if f.get("path", "").endswith(".gguf"): print("  ", f["path"], f.get("size"))
          except Exception as e: print("   (no listing)", e)'
          done

      - name: Download models
        run: |
          mkdir -p models
          get() {  # 名稱 網址…（第一個能下載的）
            name=$1; shift
            for u in "$@"; do
              if curl -fsSL --retry 3 -o "models/$name.gguf" "$u"; then echo "$name ← $u"; ls -la "models/$name.gguf"; return; fi
            done
            echo "$name：都下載不到"; rm -f "models/$name.gguf"
          }
          get qwen35-4b \
            https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf \
            https://huggingface.co/bartowski/Qwen_Qwen3.5-4B-GGUF/resolve/main/Qwen_Qwen3.5-4B-Q4_K_M.gguf
          get qwen3-4b-2507 \
            https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen3-4B-Instruct-2507-Q4_K_M.gguf \
            https://huggingface.co/bartowski/Qwen_Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen_Qwen3-4B-Instruct-2507-Q4_K_M.gguf
          get qwen35-2b \
            https://huggingface.co/unsloth/Qwen3.5-2B-GGUF/resolve/main/Qwen3.5-2B-Q4_K_M.gguf
          ls -la models

      - name: Eval
        run: |
          for m in models/*.gguf; do
            echo "################ $m"
            ./brain-eval "$m" ios/BrainEval/questions.txt 2>&1 | grep -v "^llama_\|^load\|^print_info\|^ggml_\|^gguf\|^common\|^\.\.\.\|^graph\|^sched\|^set_abort\|^init_" || true
          done
